  ]

if(!Array.isArray(data.funcionarios)) data.funcionarios=[{id:'func-joao',nome:'João Silva',cargo:'Cozinheiro',usuario:'joao',senha:'1234',ativo:true,imagem:''},{id:'func-ana',nome:'Ana Souza',cargo:'Auxiliar de cozinha',usuario:'ana',senha:'1234',ativo:true,imagem:''},{id:'func-marcos',nome:'Marcos Lima',cargo:'Churrasqueiro',usuario:'marcos',senha:'1234',ativo:true,imagem:''},{id:'func-leticia',nome:'Letícia Alves',cargo:'Auxiliar de cozinha',usuario:'leticia',senha:'1234',ativo:true,imagem:''}];

function save(){localStorage.setItem("cozinha_connect_demo",JSON.stringify(data))}

// Padroniza status antigos das compras para o novo fluxo de 5 estados.
(function normalizarStatusCompras(){
  if(!Array.isArray(data.compras)) data.compras=[];
  let alterou=false;
  data.compras.forEach(x=>{
    if(x.status==="Aprovada"){x.status="Em compra"; alterou=true;}
    else if(x.status==="Recusada"){x.status="Compra negada"; if(!x.motivoNegacao) x.motivoNegacao="Solicitação recusada anteriormente."; alterou=true;}
    if(x.id==null || x.id===""){x.id="compra-"+Date.now()+"-"+Math.random().toString(36).slice(2,8); alterou=true;}
  });
  if(alterou) save();
})()
if(!data.config || typeof data.config!=="object" || Array.isArray(data.config)) data.config={};
if(!data.config.empresa) data.config.empresa="";
if(!data.config.telefone) data.config.telefone="";
if(!data.config.whatsapp) data.config.whatsapp="";
if(!data.config.endereco) data.config.endereco="";
if(!data.config.responsavel) data.config.responsavel="";
if(!data.config.logo) data.config.logo="";
if(!data.config.adminUsuario) data.config.adminUsuario="admin";
if(!data.config.adminSenha) data.config.adminSenha="1234";
save();

// Garante IDs permanentes para avisos antigos que foram criados antes do botão EXCLUIR.
(function normalizarIdsAvisos(){
  if(!Array.isArray(data.avisos)) data.avisos=[];
  let alterou=false;
  data.avisos.forEach((a,i)=>{
    if(a.id==null || a.id===""){ a.id="aviso-"+Date.now()+"-"+i+"-"+Math.random().toString(36).slice(2,7); alterou=true; }
  });
  if(alterou) save();
})();
if(!Array.isArray(data.agenda)) data.agenda=[];
(function normalizarIdsAgenda(){
  let alterou=false;
  data.agenda.forEach((e,i)=>{
    if(e.id==null || e.id===""){ e.id="evento-"+Date.now()+"-"+i+"-"+Math.random().toString(36).slice(2,7); alterou=true; }
  });
  if(alterou) save();
})();
if(!Array.isArray(data.receitas)) data.receitas=[
  {id:1,nome:"Molho Bolonhesa",categoria:"Massas",descricao:"Molho tradicional de carne para massas.",img:"",ingredientes:[{nome:"Carne moída",qtd:10,un:"kg"},{nome:"Molho de tomate",qtd:2,un:"kg"},{nome:"Cebola",qtd:1,un:"kg"},{nome:"Sal",qtd:100,un:"g"}]},
  {id:2,nome:"Risoto de Funghi",categoria:"Pratos principais",descricao:"Risoto cremoso com funghi.",img:"",ingredientes:[{nome:"Arroz arbóreo",qtd:1,un:"kg"},{nome:"Funghi",qtd:200,un:"g"},{nome:"Caldo",qtd:2,un:"L"},{nome:"Parmesão",qtd:150,un:"g"}]},
  {id:3,nome:"Filé ao Molho Poivre",categoria:"Pratos principais",descricao:"Filé com molho poivre da cozinha.",img:"",ingredientes:[{nome:"Filé",qtd:1,un:"kg"},{nome:"Creme de leite",qtd:500,un:"ml"},{nome:"Pimenta",qtd:30,un:"g"},{nome:"Sal",qtd:15,un:"g"}]}
];
data.receitas.forEach(r=>{if(!Array.isArray(r.ingredientes))r.ingredientes=[];});
if(Array.isArray(data.avisos)){
  let avisosChanged=false;
  data.avisos.forEach((a,i)=>{ if(a.id==null){ a.id=Date.now()+i+Math.floor(Math.random()*1000); avisosChanged=true; } });
  if(avisosChanged) save();
}

function getCurrentEmployee(){
  return (data.funcionarios||[]).find(f=>String(f.id)===String(window.currentEmployeeId))||null;
}
function currentEmployeeName(){
  const f=getCurrentEmployee(); return f ? f.nome : 'Funcionário';
}
function login(){
  let u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value.trim();
  if(!u||!p) return alert("Informe usuário e senha.");
  const adminUsuario=String((data.config&&data.config.adminUsuario)||"admin").trim().toLowerCase();
  const adminSenhaAtual=String((data.config&&data.config.adminSenha)||"1234");
  if(u.toLowerCase()===adminUsuario&&p===adminSenhaAtual){ role="ADM"; window.currentEmployeeId=null; }
  else { const f=(data.funcionarios||[]).find(x=>String(x.usuario||"").trim().toLowerCase()===u.toLowerCase()&&String(x.senha||"")===p&&x.ativo); if(f){role="FUNC";window.currentEmployeeId=f.id}else return alert("Usuário ou senha inválidos."); }
  document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";
  document.getElementById("profileName").textContent=role==="ADM"?"Hyagho Gomes":((data.funcionarios||[]).find(x=>x.id===window.currentEmployeeId)||{nome:"Funcionário"}).nome;
  document.getElementById("profileRole").textContent=role==="ADM"?"Administrador":(getCurrentEmployee()?.cargo||"Funcionário");
  const lf=getCurrentEmployee(); if(role==='ADM'){document.getElementById('avatar').textContent='HG';}else{const av=document.getElementById('avatar'); if(lf&&lf.imagem){av.innerHTML=`<img src="${lf.imagem}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;}else av.textContent=initials(lf?.nome||'F');}
  render();
}
function logout(){role="";window.currentEmployeeId=null;document.getElementById("app").style.display="none";document.getElementById("login").style.display="grid";document.getElementById("loginUser").value="";document.getElementById("loginPass").value=""}

function agendaInicioHTML(){
  const eventos=Array.isArray(data.agenda)?data.agenda.slice():[];
  eventos.sort((a,b)=>((a.data||"9999-99-99")+" "+(a.hora||"")).localeCompare((b.data||"9999-99-99")+" "+(b.hora||"")));
  const proximos=eventos.slice(0,5);
  return `
    <div class="panel">
      <div class="panel-head">
        <h2>📅 Próximos compromissos</h2>
        <button class="btn light" onclick="navigate('agenda')">VER AGENDA</button>
      </div>
      ${proximos.length?proximos.map((e,i)=>`
        <div class="list-item" style="cursor:pointer" onclick="openEvent(${e.id})">
          <div>
            <b>${esc(e.nome)}</b>
            <span class="muted">📅 ${formatEventDate(e.data)} · ⏰ ${esc(e.hora||"Sem horário")} · 👥 ${esc(e.pessoas||"0")} pessoas</span>
          </div>
          <span>${i===0?"🔴":i===1?"🟢":"🟠"}</span>
        </div>`).join(""):`<p class="muted">Nenhum compromisso cadastrado na agenda.</p>`}
    </div>`;
}
function navigate(tab){
  if(!role){ return; }
  document.querySelectorAll(".nav button[data-tab]").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  const mobileMap={inicio:"inicio",compras:"compras",agenda:"agenda",avisos:"avisos"};
  if(tab==="inicio"){ render(); updateMobileNav("inicio"); }
  else if(tab==="compras"){ renderCompras(); updateMobileNav("compras"); }
  else if(tab==="receitas"){ renderReceitas(); updateMobileNav("mais"); }
  else if(tab==="agenda"){ renderAgenda(); updateMobileNav("agenda"); }
  else if(tab==="avisos"){ renderAvisos(); updateMobileNav("avisos"); }
  else if(tab==="funcionarios"){ renderFuncionarios(); updateMobileNav("mais"); }
  else if(tab==="config"){ renderConfig(); updateMobileNav("mais"); }
  document.querySelector(".sidebar")?.classList.remove("mobile-open");
  window.scrollTo({top:0,behavior:"smooth"});
}
window.navigate=navigate;
function render(){role==="ADM"?renderADM():renderFUNC(); updateMobileNav('inicio')}
function countByStatus(){
 const c=data.compras||[];
 return {p:c.filter(x=>x.status==="Pendente").length,b:c.filter(x=>x.status==="Em compra").length,c:c.filter(x=>x.status==="Comprado").length,d:c.filter(x=>x.status==="Entregue").length,n:c.filter(x=>x.status==="Compra negada").length};
}
function initials(name){return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'F'}
function quickHome(){return ``} function purchaseHomePanel(){

function excluirAviso(id){

function closeNotice(){document.getElementById("noticeModal").classList.remove("show")}
function previewNoticePhoto(event){const file=event.target.files[0];if(!file)return;if(file.size>4*1024*1024){alert("Escolha uma foto de até 4 MB.");event.target.value="";return}const reader=new FileReader();reader.onload=()=>{const img=document.getElementById("noticePreview");img.src=reader.result;img.style.display="block"};reader.readAsDataURL(file)}
function confirmNotice(){
  const t=document.getElementById("noticeTitle").value.trim();
  const d=document.getElementById("noticeText").value.trim();
  const file=document.getElementById("noticePhoto").files[0];
  const modal=document.getElementById("noticeModal");
  const editId=modal.dataset.editId;

  if(!t||!d){alert("Preencha o título e a mensagem.");return}

  const finish=(img)=>{
    if(editId){
      const a=(data.avisos||[]).find(x=>String(x.id)===String(editId));
      if(!a)return;
      a.t=t;
      a.d=d;
      if(img)a.img=img;
      delete modal.dataset.editId;
      save();
      closeNotice();
      renderAvisos();
      alert("Aviso alterado com sucesso!");
    }else{
      if(!Array.isArray(data.avisos))data.avisos=[];
      data.avisos.unshift({
        id:Date.now(),
        t,d,
        data:new Date().toLocaleDateString("pt-BR"),
        img:img||""
      });
      save();
      closeNotice();
      renderAvisos();
      alert("Aviso publicado com sucesso!");
    }
  };

  if(file){
    if(file.size>4*1024*1024){alert("Escolha uma foto de até 4 MB.");return}
    const reader=new FileReader();
    reader.onload=()=>finish(reader.result);
    reader.readAsDataURL(file);
  }else{
    const atual=editId ? ((data.avisos||[]).find(x=>String(x.id)===String(editId))||{}).img : "";
    finish(atual||"");
  }
}

function advancePurchase(id){

  changeBuyStatus(id,next);
}

function deletePurchase(id){
  if(role!=="ADM")return alert("Somente o ADM pode excluir solicitações.");
  const antes=data.compras.length; data.compras=data.compras.filter(c=>String(c.id)!==String(id));

}
function buildConsolidatedPurchaseList(){
  const approved=(data.compras||[]).filter(x=>x.status!=='Pendente' && x.status!=='Compra negada');
  const map={};
  approved.forEach(x=>{
    const produto=String(x.produto||'').trim();
    const unidade=String(x.unidade||'un').trim();
    const key=(produto.toLowerCase()+'||'+unidade.toLowerCase());
    const qtd=parseFloat(String(x.qtd||'0').replace(',','.'))||0;
    if(!map[key]) map[key]={produto,unidade,qtd:0};
    map[key].qtd+=qtd;
  });
  return Object.values(map).sort((a,b)=>a.produto.localeCompare(b.produto,'pt-BR'));
}
function fmtQtd(q){
  return Number.isInteger(q)?String(q):q.toLocaleString('pt-BR',{maximumFractionDigits:3});
}

function calcularReceitaProporcional(id){
  const r=data.receitas.find(x=>x.id===id);
  if(!r)return;

  const ings=(r.ingredientes||[]).filter(x=>x.nome && Number.isFinite(Number(x.qtd)));
  const idx=Number(document.getElementById("calcIngredient").value);
  const available=parseFloat(document.getElementById("calcAvailable").value);
  const base=ings[idx];

  if(!base || !Number.isFinite(available) || available<=0){
    alert("Informe uma quantidade disponível válida.");
    return;
  }

  const fator=available/Number(base.qtd);

  document.getElementById("calcResult").innerHTML=`
    <div style="margin-top:18px">
      <h3>🍳 Receita ajustada</h3>
      <p class="muted">Base usada: <b>${esc(base.nome)}</b> — você tem <b>${formatQty(available)} ${esc(base.un)}</b>.</p>

      <table class="result-table">
        <thead>
          <tr>
            <th>Ingrediente</th>
            <th>Original</th>
            <th>Para produzir</th>
          </tr>
        </thead>
        <tbody>
          ${ings.map(x=>`
            <tr>
              <td>${esc(x.nome)}</td>
              <td>${formatQty(Number(x.qtd))} ${esc(x.un)}</td>
              <td><b>${formatQty(Number(x.qtd)*fator)} ${esc(x.un)}</b></td>
            </tr>
          `).join("")}
        </tbody>
      </table>

      <p class="muted" style="margin-bottom:0">
        A receita original permanece salva sem nenhuma alteração.
      </p>
    </div>`;
}

function formatQty(n){
  if(Math.abs(n-Math.round(n))<1e-9)return String(Math.round(n));
  return n.toFixed(3).replace(/0+$/,"").replace(/\.$/,"");
}

function previewEditRecipe(event){
  const file=event.target.files[0];
  if(!file)return;
  if(file.size>4*1024*1024){
    alert("A foto deve ter no máximo 4 MB.");
    event.target.value="";
    return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
    const img=document.getElementById("editRecipePreview");
    img.src=reader.result;
    img.style.display="block";
  };
  reader.readAsDataURL(file);
}

}

function changeAdminPassword(){

  const usuario=document.getElementById('cfgAdminUser').value.trim();

  const nova=document.getElementById('cfgAdminNew').value.trim();

  if(atual!==senhaAtual)return alert("A senha atual está incorreta.");

// ===== CONTROLE DE COMPRAS - VERSAO ROBUSTA =====
window.ccSetPurchaseStatus = function(id, status){
  if (role !== 'ADM') { alert('Somente o ADM pode alterar o status da compra.'); return false; }
  const item = (data.compras || []).find(c => String(c.id) === String(id));
  if (!item) { alert('Solicitação de compra não encontrada.'); return false; }
  if (status === 'Compra negada') {
    const motivo = prompt('Informe o motivo da compra negada:');
    if (motivo === null) { renderCompras(); return false; }
    item.motivoNegacao = motivo.trim() || 'Não informado.';
  } else {
    item.motivoNegacao = '';
  }
  item.status = status;
  save();
  renderCompras();
  return false;
};
window.ccAdvancePurchase = function(id){
  if (role !== 'ADM') { alert('Somente o ADM pode alterar o status da compra.'); return false; }
  const item = (data.compras || []).find(c => String(c.id) === String(id));
  if (!item) { alert('Solicitação de compra não encontrada.'); return false; }
  const fluxo = { 'Pendente':'Em compra', 'Em compra':'Comprado', 'Comprado':'Entregue', 'Entregue':'Entregue', 'Compra negada':'Compra negada' };
  return window.ccSetPurchaseStatus(id, fluxo[item.status] || 'Em compra');
};
window.ccDenyPurchase = function(id){ return window.ccSetPurchaseStatus(id, 'Compra negada'); };
window.ccDeletePurchase = function(id){
  if (role !== 'ADM') { alert('Somente o ADM pode excluir solicitações.'); return false; }
  const antes = (data.compras || []).length;
  data.compras = (data.compras || []).filter(c => String(c.id) !== String(id));
  if (data.compras.length === antes) { alert('Solicitação de compra não encontrada.'); return false; }
  save();
  renderCompras();
  return false;
};
